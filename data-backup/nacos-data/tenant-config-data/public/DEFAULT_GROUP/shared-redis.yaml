spring:
  data:
    redis:
      # Redis服务器地址
      host: redis
      # Redis服务器端口
      port: 6379
      # Redis登录密码               
      password: 766498
      # Redis数据库索引（默认0）
      database: 0
      # 连接超时时间（毫秒），5秒            
      timeout: 5000
      lettuce:                 # Lettuce连接池配置（适配单机Redis）
        pool:
        # 连接池最大连接数（单机无需过高）
          max-active: 5
          # 连接池最大空闲连接数   
          max-idle: 3
          # 连接池最小空闲连接数      
          min-idle: 1
          # 连接池最大等待时间（毫秒），2秒      
          max-wait: 2000