mybatis-plus:
  # Mapper XML文件路径（扫描所有jar/classes下的mapper目录）
  mapper-locations: classpath*:/mapper/**/*.xml
  
  # 实体类别名包（简化XML中的类名引用）
  type-aliases-package: com.yuntan.**.po

  # 核心配置
  configuration:
    # 开启驼峰命名转换（create_time -> createTime）
    map-underscore-to-camel-case: true
    # 关闭二级缓存（单机项目建议关闭）
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 输出到控制台

  # 全局配置
  global-config:
    db-config:
      # 主键生成策略：雪花算法（ASSIGN_ID）
      id-type: ASSIGN_ID
      # 逻辑删除字段名（实体类中对应字段名）
      logic-delete-field: deleted
      # 逻辑删除值（1=已删除）
      logic-delete-value: 1
      # 逻辑未删除值（0=未删除）
      logic-not-delete-value: 0
      field-strategy: not_empty
