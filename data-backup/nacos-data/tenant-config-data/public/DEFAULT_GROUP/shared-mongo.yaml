spring:
  data:
    mongodb:
      # ✅ URI 中直接包含：用户名、密码、主机、端口、认证库、目标数据库
      uri: mongodb://root:766498@mongo:27017/yuntan_blog?authSource=admin
      # 注意：↑ 这里必须加上数据库名 `/yuntan_blog`

  # MongoDB 连接池配置（Spring Boot 3.x+）
  mongodb:
    connection-string: ${spring.data.mongodb.uri} # 复用上面的 URI
    pool:
      max-wait-time: 5000
      max-size: 100
      min-size: 10

# 全局时区（非 MongoDB 专属）
timezone: Asia/Shanghai