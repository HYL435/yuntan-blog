spring:
  mail:
    # QQ 邮箱 SMTP 服务器
    host: smtp.qq.com
    # QQ 邮箱 SSL 端口通常为 465
    port: 465
    # 发件人邮箱账号
    username: 2929028544@qq.com
    # 【注意】这里填的是 POP3/SMTP 服务开启后的【授权码】，不是登录密码！
    password: aeimdtmpwfjgdfhd 
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # 开启 SSL 安全连接
          ssl:
            enable: true
            socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
        # 开启调试模式，可以在控制台看到邮件发送的详细日志（上线后建议关闭）
        debug: true